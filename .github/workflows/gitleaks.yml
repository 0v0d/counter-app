name: Gitleaks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          install_dir="${RUNNER_TEMP}/gitleaks"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$install_dir/gitleaks.tar.gz"
          echo "${GITLEAKS_SHA256}  $install_dir/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$install_dir/gitleaks.tar.gz" -C "$install_dir" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Scan for secrets
        run: gitleaks detect --report-format json --report-path report.json --redact

      - name: Upload Gitleaks report
        if: ${{ always() && hashFiles('report.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: report.json
          retention-days: 7
