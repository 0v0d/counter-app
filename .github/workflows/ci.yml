name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detekt:
    name: detekt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Run detekt
        run: ./gradlew detekt --stacktrace

      - name: Upload detekt reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: detekt-reports
          path: build/reports/detekt/
          retention-days: 7

  # Android Lint と UNIT は Android SDK の準備と debug ビルドを共有するため 1 ジョブにまとめる
  lint-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
    env:
      # Dependabot とフォークからの PR はトークンが読み取り専用のため、PR コメントを省略する
      CAN_COMMENT: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.1" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --stacktrace

      # Lint が失敗しても実行し、両方の結果を報告する
      # *VRTest は Screenshots workflow が担当する
      - name: Run unit tests
        if: ${{ !cancelled() }}
        run: ./gradlew :app:testDebugUnitTest --tests '*UnitTest' :app:koverXmlReportDebug --stacktrace

      - uses: reviewdog/action-setup@v1
        if: ${{ !cancelled() && env.CAN_COMMENT == 'true' }}
        with:
          reviewdog_version: v0.21.2

      # PR で変更した行への指摘だけをコメントする
      - name: Comment Android Lint findings on PR
        if: ${{ !cancelled() && env.CAN_COMMENT == 'true' && hashFiles('app/build/reports/lint-results-debug.sarif') != '' }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
        run: reviewdog -f=sarif -name="Android Lint" -reporter=github-pr-review < app/build/reports/lint-results-debug.sarif

      - name: Comment coverage on PR
        if: ${{ !cancelled() && env.CAN_COMMENT == 'true' && hashFiles('app/build/reports/kover/reportDebug.xml') != '' }}
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: ${{ github.workspace }}/app/build/reports/kover/reportDebug.xml
          token: ${{ github.token }}
          title: "## 📊 カバレッジレポート (UNIT)"
          update-comment: true

      - name: Upload Android Lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-reports
          path: app/build/reports/lint-results-debug.*
          retention-days: 7

      - name: Upload unit test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/kover/
          retention-days: 7
